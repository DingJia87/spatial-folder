name: 问题报告
description: 报告可重复的功能、显示或文件安全问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请隐藏私人文件名、完整路径和文件内容。
  - type: input
    id: version
    attributes:
      label: 指针空间版本
      placeholder: 例如 5.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统环境
      placeholder: 例如 macOS 15.5，M2 MacBook Air，外接 4K 显示器
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序说明如何稳定复现。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除私人文件名、完整路径和文件内容。
          required: true
