name: 2.4 质量检查

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示 Swift 环境
        run: swift --version

      - name: 运行标准测试
        run: swift test -Xswiftc -warnings-as-errors

      - name: 运行完整兼容性回归
        run: ./scripts/run_self_tests.zsh

      - name: 严格 Release 构建
        run: swift build -c release -Xswiftc -warnings-as-errors
